<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanjana's bookshelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=DM+Sans:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--milk:#fff8fb;--ink:#3d2b52;--muted:#85709b;--line:#e3d3f5;--pink:#f7b3d3;--lilac:#c9b5f5;--glass:rgba(255,255,255,.62);--edge:#fff;
  --serif:'Fraunces',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--hand:'Caveat','Segoe Script',cursive}
@media (prefers-color-scheme:dark){:root{--milk:#241a33;--ink:#f6e9fb;--muted:#c0acd8;--line:#5a4676;--glass:rgba(60,44,86,.6);--edge:rgba(255,255,255,.14)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{color:var(--ink);font-family:var(--sans);height:100dvh;position:relative;background:var(--milk)}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
body::before{background:radial-gradient(45% 42% at 6% 6%,#ffd1e6,transparent 72%),radial-gradient(42% 40% at 96% 10%,#cfe0ff,transparent 72%),radial-gradient(45% 45% at 88% 96%,#c9f3e3,transparent 72%),radial-gradient(42% 42% at 4% 94%,#e2d2ff,transparent 72%),radial-gradient(30% 30% at 55% 48%,#fff3c9,transparent 72%)}
@media (prefers-color-scheme:dark){body::before{opacity:.28}}
body::after{background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='1200'%20height='800'%20fill='none'%20stroke='%23a98be0'%20stroke-width='2.5'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M1070%2080l9%2024%2024%209-24%209-9%2024-9-24-24-9%2024-9z'%20fill='%23ffc7e2'%20stroke='%23e58fc0'/%3E%3Cpath%20d='M1140%20170l5%2013%2013%205-13%205-5%2013-5-13-13-5%2013-5z'%20fill='%23d9c9ff'/%3E%3Cpath%20d='M600%2040l4%2010%2010%204-10%204-4%2010-4-10-10-4%2010-4z'%20fill='%23c8f0e0'%20stroke='%2388cdb4'/%3E%3Cpath%20d='M70%20690q20-24%2040%200t40%200%2040%200%2040%200'%20stroke='%23f29cc6'/%3E%3Cpath%20d='M90%20150c-6-14-28-8-22%2010%205%2014%2022%2022%2022%2022s17-8%2022-22c6-18-16-24-22-10z'%20fill='%23ffe1ef'%20stroke='%23e58fc0'/%3E%3Cpath%20d='M1010%20650v46l12-11%209%2019%208-4-9-18%2017-1z'%20fill='%23fff'/%3E%3Ccircle%20cx='1130'%20cy='700'%20r='6'%20fill='%23c8defc'/%3E%3Ccircle%20cx='1155'%20cy='680'%20r='4'%20fill='%23ffc7e2'%20stroke='none'/%3E%3Cpath%20d='M200%2060v18M191%2069h18'%20stroke='%2388cdb4'/%3E%3Cpath%20d='M1120%20420q18-20%2036%200t36%200'%20stroke='%23c9b5f5'/%3E%3Crect%20x='150'%20y='470'%20width='46'%20height='34'%20rx='8'%20fill='%23fff'%20stroke='%23c9b5f5'/%3E%3Cpath%20d='M150%20484h46'%20stroke='%23c9b5f5'/%3E%3C/svg%3E") center/cover no-repeat;opacity:.75}
.wrap,.case{position:relative;z-index:1}
.wrap{max-width:1180px;margin:0 auto;padding:1rem 1.25rem 1.25rem;height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:.2rem 1rem;margin-bottom:.7rem}
.back{display:inline-block;font-size:.9rem;color:var(--muted);text-decoration:none;padding:.25rem .85rem;border-radius:999px;background:var(--glass);border:1.5px solid var(--line)}
.back:hover{color:var(--ink);border-color:var(--lilac)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.5rem,3.6vw,2.4rem);margin:0;display:inline-block;background:linear-gradient(transparent 62%,rgba(247,179,211,.7) 62% 92%,transparent 92%);padding:0 .2em}
h1::after{content:"\2726";color:#e58fc0;font-size:.45em;margin-left:.35em;vertical-align:top}
.sub{flex-basis:100%;color:var(--muted);margin:0;font-family:var(--hand);font-size:1.45rem}

.win{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid var(--edge);border-radius:20px;overflow:hidden;margin-bottom:1rem;box-shadow:0 0 0 1.5px var(--line),0 14px 30px -14px rgba(150,100,200,.4)}
.bar{display:flex;align-items:center;gap:.4rem;padding:.5rem .9rem;background:linear-gradient(90deg,#ffd3e8,#e3d5ff 55%,#cfe4ff);color:#4a2f66;font-family:var(--hand);font-size:1.25rem;line-height:1}
.bar i{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px rgba(74,47,102,.35)}
.bar span{margin-left:.5rem}
.win .in{padding:.8rem .9rem .2rem}
.controls{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.6rem}
.controls input,.controls select{font:inherit;color:var(--ink);background:rgba(255,255,255,.7);border:1.5px solid var(--line);border-radius:12px;padding:.5rem .8rem}
.controls input{flex:1 1 220px;min-width:0}
.controls select option{color:#222}
.controls input:focus,.controls select:focus{outline:none;border-color:#e58fc0;box-shadow:0 0 0 3px rgba(247,179,211,.45)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.6rem}
.chip{--k:#f7b3d3;font:inherit;font-size:.85rem;font-weight:500;color:#4a2f66;background:color-mix(in srgb,var(--k) 38%,#fff);border:1.5px solid var(--k);border-radius:999px;padding:.26rem .9rem;cursor:pointer;box-shadow:0 2px 0 var(--k);transition:transform .15s}
.chip::before{content:"\2726";margin-right:.4em;font-size:.8em;color:var(--k);filter:saturate(1.8) brightness(.8)}
.chip:hover{transform:translateY(-2px) rotate(-2deg)}
.chip[aria-pressed="true"]{background:var(--k);border-color:#fff;box-shadow:0 3px 0 rgba(61,43,82,.3);transform:translateY(-1px)}
.chip[aria-pressed="true"]::before{color:#fff;filter:none}
.count{color:var(--muted);font-size:.9rem;min-height:1.3em;margin-bottom:.5rem}

.case{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 16px 0;border-radius:26px 26px 0 0;background:linear-gradient(#fddcec,#f4c8e2);box-shadow:0 0 0 2px #fff inset,0 30px 40px -22px rgba(150,80,190,.5)}
.scroller{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;padding:34px 24px 12px;scrollbar-width:none;scroll-behavior:smooth;border-radius:16px 16px 0 0;
  background:linear-gradient(to top,#e6d8fb 0 14px,transparent 14px),radial-gradient(circle,rgba(255,255,255,.75) 1.5px,transparent 2px) 0 0/30px 30px,linear-gradient(#f2eaff,#dccbf8);
  box-shadow:inset 0 12px 20px -8px rgba(120,80,180,.35),inset 10px 0 16px -10px rgba(120,80,180,.3),inset -10px 0 16px -10px rgba(120,80,180,.3)}
.scroller::-webkit-scrollbar{display:none}
.row{display:flex;flex:none;align-self:stretch;align-items:flex-end;gap:3px;width:max-content;min-width:100%}
.board{flex:none;position:relative;margin:0 -12px;height:26px;border-radius:4px 4px 14px 14px;background:linear-gradient(#fff 0 3px,#ffd0e6 3px 9px,#f4b6d5 9px);box-shadow:0 16px 22px -8px rgba(150,80,190,.4),inset 0 -3px 0 rgba(150,60,130,.15)}
.book{position:relative;border:0;padding:0;cursor:pointer;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--fg);background-color:var(--c);
  background-image:linear-gradient(90deg,rgba(255,255,255,.3),rgba(255,255,255,0) 22%,rgba(0,0,0,0) 70%,rgba(80,30,110,.16));border-radius:4px 5px 2px 2px;box-shadow:1px 0 3px rgba(90,40,120,.3);
  transform-origin:50% 100%;transition:transform .3s cubic-bezier(.2,.8,.3,1),box-shadow .3s}
.book::before,.book::after{content:"";position:absolute;left:0;right:0;height:5px;border-top:1px solid var(--fg);border-bottom:1px solid var(--fg);opacity:.4}
.book::before{top:14px}.book::after{bottom:14px}
.book .t{writing-mode:vertical-rl;font-family:var(--serif);font-weight:600;font-size:.9rem;line-height:1.1;max-height:calc(100% - 70px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em}
.book:hover,.book:focus-visible{transform:translateY(-16px) rotate(-1.5deg);box-shadow:8px 18px 20px -6px rgba(110,50,150,.45);z-index:2;outline:none}
.book:focus-visible{outline:2px solid #e58fc0;outline-offset:2px}
.arrow{position:absolute;top:50%;z-index:5;width:40px;height:40px;margin-top:-20px;border-radius:50%;border:2px solid #fff;background:var(--pink);color:#4a2a55;font-size:1.3rem;cursor:pointer;box-shadow:0 3px 10px rgba(150,80,190,.4)}
.arrow:hover{background:#ffd3ea}
.arrow.l{left:-14px}.arrow.r{right:-14px}
.empty{padding:3rem 1rem;color:#85709b;text-align:center;width:100%}

dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100vw;height:100dvh;color:#3d2b52}
dialog[open]{display:grid;place-items:center}
dialog::backdrop{background:radial-gradient(circle at 25% 15%,rgba(255,200,230,.5),transparent 60%),rgba(88,60,130,.45);backdrop-filter:blur(10px)}
.stage{display:contents}
.card{position:relative;width:min(780px,94vw);max-height:88dvh;overflow:auto;scrollbar-width:none;background:#fffaf7;border-radius:26px;box-shadow:0 0 0 2px #fff,0 40px 80px -24px rgba(70,40,110,.6);opacity:0;transform:translateY(28px) scale(.96);transition:transform .45s cubic-bezier(.2,.9,.3,1),opacity .3s}
.card::-webkit-scrollbar{display:none}
.card.in{opacity:1;transform:none}
.head{display:flex;align-items:center;gap:1.5rem;padding:1.6rem;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 50%,#fff),color-mix(in srgb,var(--c) 14%,#fff))}
.art{flex:none;position:relative;width:clamp(96px,22vw,150px);aspect-ratio:2/3;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:13% 10%;background-color:var(--c);color:var(--fg);border-radius:4px 12px 12px 4px;
  background-image:linear-gradient(90deg,rgba(0,0,0,.2),rgba(255,255,255,.16) 6%,transparent 14%),radial-gradient(circle at 80% 8%,rgba(255,255,255,.4),transparent 50%);box-shadow:0 18px 30px -10px rgba(70,40,110,.55);transform:rotate(-9deg) scale(.85);transition:transform .7s cubic-bezier(.2,.9,.3,1) .1s}
.in .art{transform:rotate(-3deg)}
.art::before{content:"";position:absolute;inset:5%;border:1.5px solid var(--fg);opacity:.4;border-radius:8px}
.art b{font-family:var(--serif);font-size:clamp(.7rem,1.7vw,1rem);line-height:1.15;overflow:hidden}
.art i{font-style:normal;opacity:.7}.art small{font-size:.65rem;opacity:.85}
.hd{min-width:0}
.hd h3{font-family:var(--serif);font-size:clamp(1.3rem,3.2vw,2rem);line-height:1.15;margin:0 1.6rem .2rem 0;font-weight:600}
.au{margin:0 0 .4rem;color:#6d5a86;font-style:italic;font-family:var(--serif)}
.stars{color:#f27fb1;letter-spacing:.14em}
.facts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.facts span{font-size:.8rem;padding:.2rem .7rem;border-radius:999px;background:rgba(255,255,255,.75);border:1.5px solid #fff}
.body{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.3rem;padding:1.4rem 1.6rem 1.6rem}
.sum{margin:0;line-height:1.65;font-size:.95rem}
.side{display:flex;flex-direction:column;gap:1rem;padding-top:.5rem}
.note{position:relative;padding:1.1rem .95rem .6rem;background:#fff3b6;border-radius:4px;transform:rotate(-1.2deg);box-shadow:0 6px 12px -6px rgba(150,110,30,.4)}
.note::before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(247,179,211,.8);transform:rotate(3deg)}
.lbl{font-family:var(--serif);font-style:italic;color:#85709b;margin:0 0 .2rem;font-size:.85rem}
.hand{font-family:var(--hand);font-size:1.45rem;line-height:1.25;color:#5a4478;margin:0 0 .4rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem}
.tags button{font:inherit;font-size:.8rem;border:1.5px solid #eadaf8;background:#fbf3ff;color:#7a5aa6;border-radius:999px;padding:.15rem .7rem;cursor:pointer}
.tags button:hover{background:#ffd3ea;border-color:#f7b3d3;color:#4a2a55}
.close{position:absolute;top:.8rem;right:.8rem;z-index:2;width:34px;height:34px;padding:0;font:inherit;background:#fff;color:#7a3f7c;border:0;border-radius:50%;cursor:pointer;box-shadow:0 3px 10px rgba(120,60,150,.3)}
.close:hover{background:#ffd3ea}
@media (max-width:620px){
  .wrap{padding:.7rem .8rem .8rem}
  .controls{gap:.5rem}.controls input{flex:1 1 100%}.controls select{flex:1 1 0;min-width:0;font-size:.85rem;padding:.45rem .5rem}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:5px}.chips::-webkit-scrollbar{display:none}.chip{flex:none}
  .arrow{display:none}.scroller{padding-inline:14px}.case{padding:12px 10px 0}
  dialog[open]{place-items:end center}
  .card{width:100vw;max-height:90dvh;border-radius:26px 26px 0 0;transform:translateY(100%)}
  .head{padding:1.2rem 1rem;gap:1rem}.body{padding:1.1rem 1rem 1.6rem}
}
@media (max-height:640px){.sub{display:none}}
@media (max-height:520px){.count{display:none}.win .in{padding-top:.5rem}.top{margin-bottom:.4rem}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="index.html">&larr; Back to profile</a>
  <h1>Sanjana's bookshelf</h1>
  <p class="sub">Hover to pull a book off the shelf, click to open it.</p></div>

  <section class="win"><div class="in"><div class="controls">
    <input id="q" type="search" placeholder="Search title, author, tag or notes" aria-label="Search books">
    <select id="year" aria-label="Year read"></select>
    <select id="rating" aria-label="Minimum rating">
      <option value="0">Any rating</option><option value="4">4 stars and up</option><option value="5">5 stars only</option>
    </select>
    <select id="sort" aria-label="Sort by">
      <option value="csv">Order in file</option><option value="recent">Most recently read</option>
      <option value="title">Title A to Z</option><option value="author">Author A to Z</option>
      <option value="rating">Highest rated</option><option value="pages">Longest first</option>
    </select>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter by genre"></div>
  <div class="count" id="count" aria-live="polite"></div>
  </div></section>

  <div class="case">
    <button class="arrow l" id="prev" aria-label="Scroll left">&lsaquo;</button>
    <button class="arrow r" id="next" aria-label="Scroll right">&rsaquo;</button>
    <div class="scroller" id="scroller"><div class="row" id="row"></div></div>
    <div class="board"></div>
  </div>
</div>

<dialog id="dlg" aria-label="Book details"><div class="stage" id="stage"></div></dialog>

<script>
const CSV_PATH='books.csv';
const PALETTE=['#f4a6c6','#b9a3f0','#8fd3c0','#f7c98b','#8db8f2','#f39bab','#c6b5ff','#a5dcc8','#f6b7a0','#9fc5e8','#e4a5e6','#b8d98f'];
const KC=['#f7b3d3','#c9b5f5','#a8e3cf','#ffd98a','#a9cbf7','#ffb9a3','#e7b0f0','#b8e08f'];
let books=[],activeGenre='All';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);
  const head=rows.shift().map(h=>h.trim().toLowerCase());
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()])));
}
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
function fgFor(hex){const n=parseInt(hex.replace('#','').slice(0,6),16);
  return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255>0.6?'#3d2b52':'#fffaf7'}
function prep(b,i){
  const h=hash(b.title||String(i));
  const color=/^#?[0-9a-f]{6}$/i.test(b.color||'')?'#'+b.color.replace('#',''):PALETTE[h%PALETTE.length];
  const pages=parseInt(b.pages)||250;
  return {...b,i,color,fg:fgFor(color),pagesN:pages,ratingN:parseFloat(b.rating)||0,
    tagList:(b.tags||'').split(/[;|]/).map(s=>s.trim()).filter(Boolean),
    w:Math.max(34,Math.min(74,Math.round(pages/8))),hp:62+(h%28)};
}
function buildFilters(){
  const genres=['All',...[...new Set(books.map(b=>b.genre).filter(Boolean))].sort()];
  $('chips').innerHTML='';
  genres.forEach((g,gi)=>{const c=document.createElement('button');c.style.setProperty('--k',KC[gi%KC.length]);c.className='chip';c.textContent=g;
    c.setAttribute('aria-pressed',g===activeGenre);c.onclick=()=>{activeGenre=g;buildFilters();render()};$('chips').append(c)});
  const cur=$('year').value||'all';
  const years=[...new Set(books.map(b=>b.year_read).filter(Boolean))].sort().reverse();
  $('year').innerHTML='<option value="all">All years</option>'+years.map(y=>`<option>${esc(y)}</option>`).join('');
  $('year').value=years.includes(cur)?cur:'all';
}
function render(){
  const q=$('q').value.toLowerCase().trim(),yr=$('year').value,mr=+$('rating').value,sort=$('sort').value;
  let list=books.filter(b=>(activeGenre==='All'||b.genre===activeGenre)&&(yr==='all'||b.year_read===yr)&&b.ratingN>=mr&&
    (!q||[b.title,b.author,b.genre,b.tags,b.notes,b.summary].join(' ').toLowerCase().includes(q)));
  const s={title:(a,b)=>a.title.localeCompare(b.title),author:(a,b)=>a.author.localeCompare(b.author),
    rating:(a,b)=>b.ratingN-a.ratingN,pages:(a,b)=>b.pagesN-a.pagesN,
    recent:(a,b)=>(b.date_finished||b.year_read||'').localeCompare(a.date_finished||a.year_read||'')}[sort];
  if(s)list=[...list].sort(s);
  $('count').textContent=`${list.length} of ${books.length} books`;
  const row=$('row');row.innerHTML='';
  if(!list.length){row.innerHTML='<div class="empty">No books match. Try clearing a filter.</div>';return}
  list.forEach(b=>{
    const el=document.createElement('button');el.className='book';
    el.style.cssText=`--c:${b.color};--fg:${b.fg};width:${b.w}px;height:${b.hp}%`;
    el.setAttribute('aria-label',`${b.title} by ${b.author}`);
    el.innerHTML='<span class="t"></span>';el.firstChild.textContent=b.title;
    el.onclick=()=>openBook(b);row.append(el);
  });
  $('scroller').scrollLeft=0;
}

let closing=false;
function openBook(b){
  const r=Math.round(b.ratingN),stars=r?'\u2605'.repeat(r)+'\u2606'.repeat(5-r):'';
  const facts=[b.genre,b.pages&&b.pages+' pages',b.date_finished||b.year_read].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('');
  const side=(b.notes||b.tagList.length)?`<div class="side">${b.notes?`<div class="note"><p class="lbl">My notes</p><p class="hand">${esc(b.notes)}</p></div>`:''}<div class="tags" id="tg"></div></div>`:'';
  $('stage').innerHTML=`<div class="card" id="card" style="--c:${b.color};--fg:${b.fg}">
    <button class="close" id="cl" aria-label="Close">\u2715</button>
    <div class="head"><div class="art"><b>${esc(b.title)}</b><i>\u2726</i><small>${esc(b.author)}</small></div>
      <div class="hd"><h3>${esc(b.title)}</h3><p class="au">${esc(b.author)}</p><div class="stars" aria-label="${b.ratingN} out of 5">${stars}</div><div class="facts">${facts}</div></div></div>
    <div class="body"><p class="sum">${esc(b.summary)||'No summary yet.'}</p>${side}</div></div>`;
  b.tagList.forEach(t=>{const x=document.createElement('button');x.textContent='#'+t;
    x.onclick=()=>{closeBook(()=>{$('q').value=t;render()})};$('tg').append(x)});
  $('cl').onclick=()=>closeBook();
  closing=false;$('dlg').showModal();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const c=$('card');if(c)c.classList.add('in')}));
}
function closeBook(after){
  if(closing)return;closing=true;
  const c=$('card');if(c)c.classList.remove('in');
  setTimeout(()=>{$('dlg').close();if(after)after()},320);
}
$('dlg').addEventListener('cancel',e=>{e.preventDefault();closeBook()});
$('dlg').addEventListener('click',e=>{if(!e.target.closest('.card'))closeBook()});

['q','year','rating','sort'].forEach(id=>$(id).addEventListener('input',render));
const step=()=>Math.max(240,$('scroller').clientWidth*0.7);
$('prev').onclick=()=>$('scroller').scrollBy({left:-step()});
$('next').onclick=()=>$('scroller').scrollBy({left:step()});
$('scroller').addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();$('scroller').scrollLeft+=e.deltaY}},{passive:false});

fetch(CSV_PATH).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{
  books=parseCSV(t).filter(b=>b.title).map(prep);buildFilters();render();
}).catch(()=>{$('row').innerHTML='<div class="empty">Could not load books.csv. If you opened this file directly, run a local server (python3 -m http.server) or view it on GitHub Pages.</div>'});
</script>
